<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="droneGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="sensorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0B0F19"/>
  <!-- Drone Frame -->
  <line x1="16" y1="16" x2="48" y2="48" stroke="url(#droneGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="16" x2="16" y2="48" stroke="url(#droneGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Rotors -->
  <circle cx="16" cy="16" r="8" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8"/>
  <circle cx="48" cy="16" r="8" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8"/>
  <circle cx="16" cy="48" r="8" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8"/>
  <circle cx="48" cy="48" r="8" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8"/>
  <!-- Center Sensor Hub -->
  <circle cx="32" cy="32" r="14" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
  <circle cx="32" cy="32" r="6" fill="#10B981"/>
</svg>
